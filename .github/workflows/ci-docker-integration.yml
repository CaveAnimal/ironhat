name: CI - Docker Integration

on:
  push:
    branches: [ main, FeH-001 ]
  pull_request:
    branches: [ main, FeH-001 ]

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build embedding shim image
        working-directory: tools/embedding_service
        run: |
          docker build -t embedding-shim:ci .

      - name: Run embedding shim container
        run: |
          docker run -d --name embedding-shim -p 8000:8000 embedding-shim:ci

      - name: Wait for shim ready
        run: |
          for i in $(seq 1 30); do
            if curl -sS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "shim is up"
              exit 0
            fi
            sleep 1
          done
          echo "shim failed to start"
          docker logs embedding-shim || true
          exit 1

      - name: Run integration tests against container
        working-directory: .
        env:
          PYTHONPATH: tools/embedding_service
        run: |
          python -m pip install -r tools/embedding_service/requirements.txt
          python -m pip install pytest
          pytest -q tools/embedding_service/tests/test_shim_prod.py -q

      - name: Stop container
        if: always()
        run: |
          docker stop embedding-shim || true
          docker rm embedding-shim || true
